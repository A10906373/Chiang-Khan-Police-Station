			</item>
		<item>
		<title>Ask AIMee: An accessible accessibility-focused AI chatbot</title>
		<link>https://webaim.org/blog/ask-aimee/</link>
					<comments>https://webaim.org/blog/ask-aimee/#comments</comments>
		
		<dc:creator><![CDATA[Jared Smith]]></dc:creator>
		<pubDate>Tue, 31 Mar 2026 16:49:07 +0000</pubDate>
				<category><![CDATA[Uncategorized]]></category>
		<guid isPermaLink="false">https://webaim.org/blog/?p=2876</guid>

					<description><![CDATA[We&#8217;re happy to introduce AIMee &#8211; an easy-to-use, AI-powered conversational chatbot focused on accessibility. AIMee has been designed to be highly accessible to users with disabilities. Ask her accessibility questions to get quick answers and guidance. The name &#8220;AIMee&#8221; plays off of the &#8220;AIM&#8221; (Accessibility In Mind) from &#8220;WebAIM&#8221; and also &#8220;AI&#8221;. Here are some [&#8230;]]]></description>
										<content:encoded><![CDATA[
<p class="wp-block-paragraph"><img decoding="async" src="https://webaim.org/AIMee/media/AIMee2.svg" alt="Ask AIMee logo" class="floatright border" style="width:170px;padding:5px;">We&#8217;re happy to introduce <a href="https://webaim.org/AIMee/">AIMee</a> &#8211; an easy-to-use, AI-powered conversational chatbot focused on accessibility. AIMee has been designed to be highly accessible to users with disabilities. Ask her accessibility questions to get quick answers and guidance.</p>



<p class="wp-block-paragraph">The name &#8220;AIMee&#8221; plays off of the &#8220;AIM&#8221; (Accessibility In Mind) from &#8220;WebAIM&#8221; and also &#8220;AI&#8221;.</p>



<p class="wp-block-paragraph">Here are some examples of the types of things you can ask AIMee:</p>



<ul class="wp-block-list">
<li>Paste in code that has accessibility issues and ask AIMee to provide recommendations for code fixes.</li>



<li>Provide a description of your organization and ask AIMee to generate a draft accessibility policy.</li>



<li>Ask AIMee to explain or summarize an accessibility concept or a WCAG success criterion.</li>



<li>Ask AIMee to provide a list of resources on a particular accessibility topic.</li>



<li>Provide an accessibility technique and ask AIMee to generate a checklist for testing or implementing it.</li>



<li>Ask AIMee to test your knowledge by generating a list of questions about WCAG or some other accessibility concept.</li>



<li>Ask AIMee to generate an easier, more understandable version of text you provide.</li>
</ul>



<p class="wp-block-paragraph">We recognize that chatbots, and even accessibility-focused chatbots, are not entirely unique. And we recognize that AI can often provide guidance that is not accurate or supportive of individuals with disabilities. AIMee primarily uses the Qwen 3 Coder LLM (Large Language Model) with additional guardrails and structures in place to support more accurate and technically sound answers in comparison to many other models. As with all AI, hallucinations and incorrect answers can occur. AIMee&#8217;s answers should be verified and used at your own risk.</p>



<p class="wp-block-paragraph">We invite you to <a href="https://webaim.org/AIMee/">ask AIMee</a> the next time you have an accessibility question. If there is sufficient interest, we may add additional features, such as file uploading/downloading, save functionality for chat histories, etc.</p>



<p class="wp-block-paragraph">If you have feedback for us, please comment below. </p>



<p class="wp-block-paragraph"></p>
]]></content:encoded>
					
					<wfw:commentRss>https://webaim.org/blog/ask-aimee/feed/</wfw:commentRss>
			<slash:comments>6</slash:comments>
		
		
			</item>
		<item>
		<title>A New Path for Digital Accessibility?</title>
		<link>https://webaim.org/blog/a-new-path/</link>
					<comments>https://webaim.org/blog/a-new-path/#comments</comments>
		
		<dc:creator><![CDATA[George Joeckel]]></dc:creator>
		<pubDate>Fri, 27 Feb 2026 19:02:14 +0000</pubDate>
				<category><![CDATA[Uncategorized]]></category>
		<guid isPermaLink="false">https://webaim.org/blog/?p=2842</guid>

					<description><![CDATA[Please note This post will explore how an adaptive, intelligent system could empower users with disabilities to optimize their experience in digital environments. Even were such a system available tomorrow, developers of digital content, services, and products would still be responsible for providing equal access to ALL users. Consider a few of the many exciting [&#8230;]]]></description>
										<content:encoded><![CDATA[
<div class="note">
<div class="title">Please note</div>
<p>This post will explore how an adaptive, intelligent system could empower users with disabilities to optimize their experience in digital environments. Even were such a system available tomorrow, developers of digital content, services, and products would still be responsible for providing equal access to ALL users.</p>
</div>



<p class="wp-block-paragraph">Consider a few of the many exciting advances in assistive technology and digital accessibility over the past few years:</p>



<ul class="wp-block-list">
<li><a href="https://www.hearingloss.org/find-help/auracast/"><strong>Auracast</strong></a>: a technology that enables one device to transmit sound (e.g., language translation) wirelessly to multiple users with a compatible device, faster than traditional Bluetooth, without requiring pairing,</li>



<li><a href="https://www.playstation.com/en-us/accessories/access-controller/"><strong>PlayStation Access Controller</strong></a>: a highly customizable controller kit designed for gamers with limited motor control,</li>



<li><strong><a href="https://commission.europa.eu/strategy-and-policy/policies/justice-and-fundamental-rights/disability/european-accessibility-act-eaa_en" target="_blank" rel="noreferrer noopener">The European Accessibility Act (EAA)</a></strong>: digital accessibility legislation that applies to both the hardware and software of digital products and services.</li>
</ul>



<p class="wp-block-paragraph">There has also been an enormous increase in the availability, capability, and use of artificial intelligence (AI). AI methodologies such as natural language processing, computer vision, and machine learning are actively transforming both assistive technologies and digital accessibility practices. As <a href="https://pubmed.ncbi.nlm.nih.gov/40077118/">Giansanti and Pirrera (2025)</a> observe:</p>



<blockquote class="wp-block-quote is-layout-flow wp-block-quote-is-layout-flow">
<p class="wp-block-paragraph">&#8220;AI itself is expanding the concept of assistive technology, shifting from traditional tools to intelligent systems capable of learning and adapting to individual needs. This evolution represents a fundamental change in assistive technology, emphasizing dynamic, adaptive systems over static solutions.&#8221;</p>
</blockquote>



<p class="wp-block-paragraph">I’d like to propose a term for the space where assistive technology, digital accessibility, and artificial intelligence converge: <strong>Intelligent Digital Accessibility Assistance</strong>.</p>


<div class="wp-block-image">
<figure class="aligncenter size-large is-resized"><img fetchpriority="high" decoding="async" width="1024" height="1024" src="https://webaim.org/blog/wp-content/uploads/2026/02/intelligent-digital-accessibility-assitance-1024x1024.png" alt="" class="wp-image-2844" style="width:371px;height:auto" srcset="https://webaim.org/blog/wp-content/uploads/2026/02/intelligent-digital-accessibility-assitance-1024x1024.png 1024w, https://webaim.org/blog/wp-content/uploads/2026/02/intelligent-digital-accessibility-assitance-300x300.png 300w, https://webaim.org/blog/wp-content/uploads/2026/02/intelligent-digital-accessibility-assitance-150x150.png 150w, https://webaim.org/blog/wp-content/uploads/2026/02/intelligent-digital-accessibility-assitance-768x768.png 768w, https://webaim.org/blog/wp-content/uploads/2026/02/intelligent-digital-accessibility-assitance-1536x1536.png 1536w, https://webaim.org/blog/wp-content/uploads/2026/02/intelligent-digital-accessibility-assitance-2048x2048.png 2048w" sizes="(max-width: 1024px) 100vw, 1024px" /></figure>
</div>


<p class="wp-block-paragraph">As a thought experiment, let’s explore the concept of a proactive, personalized mediator that provides assistance by empowering a user to adapt, translate, and restructure digital content and environments to match their unique preferences. I will call this an <strong>Intelligent Digital Accessibility Assistant</strong> (<strong>IDAA)</strong>.</p>



<h2 class="wp-block-heading">User Configuration and Training</h2>



<p class="wp-block-paragraph">Each user would help their IDAA develop and cultivate a comprehensive understanding of their environment, needs, preferences, abilities, and disabilities. In early versions, setup may require a manual process to understand the user&#8217;s assistive technology, preferences for interacting with digital content, and digital activities. However, as these Intelligent Assistants mature, the setup could happen automatically by observing and learning a user’s requirements and preferences. The user could then choose to have the assistant automatically adapt based on an ongoing analysis of their behavior, either autonomously, or by providing recommendations for them to authorize or reject.</p>



<h3 class="wp-block-heading">Tools</h3>



<p class="wp-block-paragraph">In the setup stage,&nbsp; a blind person might specify that they use both software (e.g., screen reader) and hardware (e.g., braille display) assistive technology. The Assistant would need to know details such as software version or product model number and any customizations made to the default settings. A user could then elect to have the Assistant notify the user with real-time developments related to their assistive technology: changes to a user interface, new features, software/firmware updates, etc. An Assistant might also be tasked with identifying and sharing emerging best practices for a user&#8217;s tools.</p>



<h3 class="wp-block-heading">Content</h3>



<p class="wp-block-paragraph">To help the IDAA understand their general preferences, a user could grant permissions that would allow the Assistant to monitor and analyze specified interactions with digital content. For example, when a screen reader encounters a legacy website with poor semantic markup, the user might instruct the Assistant to analyze the visual layout and text hierarchy to infer the missing structure required by their assistive technology. Or when reading an email with a significant amount of visual formatting styles (italics, bold, strikethrough), a user might ask the Assistant to dynamically update their screen reader’s settings to present formatted text in a distinctive speech style.</p>



<h3 class="wp-block-heading">Activities</h3>



<p class="wp-block-paragraph">A user could also configure settings for different session &#8220;modes&#8221;. For example, in &#8220;research&#8221; mode a user could have the IDAA rapidly scan an academic paper, generate a jargon-free summary, and generate tables for any visual charts. Or a user might switch to &#8220;entertainment&#8221; mode to watch a movie. The Assistant would silence audio notifications for non-critical messages, and generate a log of messages to review later. While an Assistant would likely have some default modes, it could also help a user build custom modes based on their engagement preferences for additional types of digital content and/or specialized virtual environments.</p>



<h2 class="wp-block-heading">User-driven Accessibility</h2>



<p class="wp-block-paragraph">After establishing a baseline awareness of a user&#8217;s current digital engagement practices, an Assistant&#8217;s ongoing encoding process would continue to optimize its alignment with the user. To facilitate this process a user might instruct an Assistant to:</p>



<ul class="wp-block-list">
<li>Develop recommendations for the expansion, refinement, and revision of its context awareness.</li>



<li>Propose new capabilities for the user to authorize.</li>



<li>Conduct web research to identify new accessibility resources aligned with the user&#8217;s preferences.</li>
</ul>



<p class="wp-block-paragraph">In such an environment, the degree of collaboration with an Assistant is truly open-ended, and completely determined by the user.</p>



<h2 class="wp-block-heading">Conclusion</h2>



<p class="wp-block-paragraph">As a daily user of artificial intelligence, and a researcher seeking to understand the rapidly-evolving scope of its capabilities, I feel confident in stating that the availability of something like an Intelligent Digital Accessibility Assistant, is a &#8220;when&#8221;, not an &#8220;if&#8221;. There are significant concerns with AI that must be addressed: equity of access, bias in training data, environmental impacts, and reliability. And there is also a growing potential for a user with a disability to partner with AI to expand their access to the digital world.</p>



<p class="wp-block-paragraph">I hope you found this exploration thought-provoking and inspiring, and that you will share your thoughts, concerns, and questions in the comments section.</p>



<p class="wp-block-paragraph"></p>
]]></content:encoded>
					
					<wfw:commentRss>https://webaim.org/blog/a-new-path/feed/</wfw:commentRss>
			<slash:comments>4</slash:comments>
		
		
			</item>
		<item>
		<title>2026 Predictions: The Next Big Shifts in Web Accessibility</title>
		<link>https://webaim.org/blog/2026-predictions/</link>
					<comments>https://webaim.org/blog/2026-predictions/#comments</comments>
		
		<dc:creator><![CDATA[John Northup]]></dc:creator>
		<pubDate>Mon, 22 Dec 2025 23:22:37 +0000</pubDate>
				<category><![CDATA[Uncategorized]]></category>
		<guid isPermaLink="false">https://webaim.org/blog/?p=2834</guid>

					<description><![CDATA[I’ve lived long enough, and worked in accessibility long enough, to have honed a healthy skepticism when I hear about the Next Big Thing. I’ve seen lush website launches that look great, until I activate a screen reader. Yet, in spite of it all, accessibility does evolve, but quietly rather than dramatically. As I gaze [&#8230;]]]></description>
										<content:encoded><![CDATA[
<p class="wp-block-paragraph">I’ve lived long enough, and worked in accessibility long enough, to have honed a healthy skepticism when I hear about the Next Big Thing. I’ve seen lush website launches that look great, until I activate a screen reader.</p>



<p class="wp-block-paragraph">Yet, in spite of it all, accessibility <em>does</em> evolve, but quietly rather than dramatically. As I gaze ahead to 2026, several trends are already taking shape. These are more than theories and ideas; they are practical shifts that website owners are beginning to feel today.</p>



<p class="wp-block-paragraph">Here are some likely, meaningful changes on the near horizon.</p>



<h2 class="wp-block-heading">1. AI Will Improve Accessibility Tools—But Not Replace Expertise</h2>



<p class="wp-block-paragraph">I have to admit, over the past year, ChatGPT has become my confidante, advisor, reality checker, summarizer, and occasional Spanish interpreter. It’s like having a faithful human assistant who never grows weary of my repeated inquiries. But like a human assistant, it sometimes takes a few tries to get it right. That’s why I see AI more as a valuable helper than a project manager. It’s changing how accessibility testing tools work and getting better at identifying patterns, grouping related issues, and prioritizing findings. This trend will continue.</p>



<p class="wp-block-paragraph">What will <em>not</em> happen is full automation of accessibility evaluation. I do not trust it with determining whether alternative text is meaningful, evaluating interaction flow and user expectations, or understanding context and intent.</p>



<p class="wp-block-paragraph">In other words, AI can help raise some flags quickly, but I do not trust it to decide whether an experience actually works for a human being.</p>



<p class="wp-block-paragraph">So, the real shift for 2026 will be AI’s contribution to workflow efficiency, not replacement. Organizations that pair smarter tools with knowledgeable human reviewers will gain speed and consistency. Those that expect AI to do it for them will continue to miss critical barriers—just faster than before.</p>



<h2 class="wp-block-heading">2. WCAG 2.2 Will Increasingly Become the Procurement Baseline</h2>



<p class="wp-block-paragraph">WCAG 2.2 may no longer feel new to the industry, but many organizations are only beginning to adopt it. WebAIM began offering it to our evaluation customers as the default as soon as it was finalized, but some customers whose internal standards specify 2.1 remain hesitant. When a new version is published, there’s always an interim time when, to some, the old version still feels current and the new version feels experimental and over–the-top. During 2026, I’d like to see the landscape shift so that 2.1 feels old (which it is) and 2.2 just feels current and normal. There’s nothing really revolutionary about 2.2; the changes largely address real barriers that users experience daily: Focus appearance, accessible authentication, dragging alternatives, consistent help…</p>



<p class="wp-block-paragraph">It is up to those of us in the industry to lead this shift. In the coming year, I expect WCAG 2.2 to become the <em>default</em> expectation in procurement language, RFPs, and accessibility evaluation.</p>



<h2 class="wp-block-heading">3. Native HTML Will Gradually Come Back</h2>



<p class="wp-block-paragraph">After years of JavaScript-heavy, ARIA-laden custom widgets, I’m noticing a subtle and gradual shift back toward native HTML elements and browser-supported behaviors. Native HTML elements have built-in accessibility support, receive ongoing browser improvements, work more predictably across assistive technologies, and reduce the need for complex ARIA patterns.</p>



<p class="wp-block-paragraph">WebAIM’s standard accessibility training presentation implores developers to “just use a button” instead of creating clickable <code>&lt;span></code> or <code>&lt;div></code> elements with JavaScript events and ARIA layered on. Out in the field, I’m seeing this becoming less of an issue. However, I regularly see custom widgets implemented where a standard <code>&lt;select></code> or <code>&lt;details></code>/<code>&lt;summary></code> would do the job.</p>



<p class="wp-block-paragraph">So, in 2026, I expect to see fewer fully custom widgets and more careful use of <code>&lt;button></code>, <code>&lt;dialog></code>, <code>&lt;details></code>/<code>&lt;summary></code>, <code>&lt;select></code>, and other form controls—often styled heavily (and that’s fine), but functionally native. Teams that embrace native patterns will ship faster, debug less, and maintain accessibility more reliably than those rebuilding basic controls from scratch. I’ll be watching the <a href="https://webaim.org/projects/million/" target="_blank" rel="noreferrer noopener">WebAIM Million</a> to see how this prediction plays out.</p>



<h2 class="wp-block-heading">4. Accessibility Debt Will Be Recognized as a Business Risk</h2>



<p class="wp-block-paragraph">Accessibility barriers accumulate quietly through redesigns, framework updates, staff turnover, and rushed deadlines. The result is accessibility debt—a backlog of small issues that eventually snowball into large ones. The larger the backlog gets, the more onerous it appears.</p>



<p class="wp-block-paragraph">However, more organizations are beginning to recognize that accessibility debt increases legal exposure (especially those organizations that are in litigation), slows down development cycles, undermines user trust, and costs more to remediate later.</p>



<p class="wp-block-paragraph">Over the course of 2026, forward-thinking organizations will increasingly treat accessibility maintenance as ongoing infrastructure, not a one-time remediation project. Regular evaluations, regression testing, and staff training will increasingly be understood as risk management more than an optional “nice-to-have.”</p>



<h2 class="wp-block-heading">5. Native App Accessibility Will Influence Web Practices More Directly</h2>



<p class="wp-block-paragraph">Native app accessibility is no longer a separate conversation—it’s actively shaping web accessibility thinking. Concepts like clear, concise control names, predictable focus management, gesture alternatives, and logical reading order apply equally to web and native platforms. As teams evaluate both web and mobile products, accessibility practices will converge around shared principles rather than platform-specific checklists. This cross-pollination will benefit users and challenge teams to think beyond traditional “web-only” paradigms and assumptions.</p>



<h2 class="wp-block-heading">6. User Preferences Will Matter More Than Page-Level Settings</h2>



<p class="wp-block-paragraph">Users increasingly rely on system and browser preferences, like prefers-reduced-motion, high contrast, forced colors, dark mode, text size, and default zoom. During 2026, the accessibility industry will begin to treat the idea of a single “accessible” design as only the beginning, instead of the destination, and increasingly anticipate and respect user preferences across environments. Designs that override system settings, hard-code colors, or ignore user preferences will feel increasingly brittle—and increasingly inaccessible to users.</p>



<h2 class="wp-block-heading">7. WCAG 3 Thinking Will Influence Practice Before the Standard Arrives</h2>



<p class="wp-block-paragraph">WCAG 3 is still years away, but its underlying philosophy—focusing on outcomes, tasks, and usability rather than rigid pass/fail criteria—is already influencing how accessibility professionals think.</p>



<p class="wp-block-paragraph">We can expect more emphasis on task completion, more discussion of severity and impact, greater recognition of partial conformance, and broader inclusion of cognitive and learning considerations. Organizations that adopt this mindset early will be better prepared for future standards while delivering better experiences right now.</p>



<h2 class="wp-block-heading">Looking Ahead</h2>



<p class="wp-block-paragraph">Accessibility progress rarely makes headlines. It happens through careful decisions, better defaults, and sustained attention to user needs. The most impactful changes coming next year are practical, structural, and long overdue—not the stuff that grabby news items are made of, but the kind of improvements that users will feel nonetheless.</p>



<p class="wp-block-paragraph">Organizations that succeed in accessibility will be those that invest in people, not just tools, treat accessibility as a journey rather than a destination, build on native HTML foundations, recognize and respect user preferences, and focus on practical outcomes.</p>
]]></content:encoded>
					
					<wfw:commentRss>https://webaim.org/blog/2026-predictions/feed/</wfw:commentRss>
			<slash:comments>2</slash:comments>
		
		
			</item>
		<item>
		<title>Word and PowerPoint Alt Text Roundup</title>
		<link>https://webaim.org/blog/word-and-powerpoint-alt-text-roundup/</link>
					<comments>https://webaim.org/blog/word-and-powerpoint-alt-text-roundup/#comments</comments>
		
		<dc:creator><![CDATA[Jon Whiting]]></dc:creator>
		<pubDate>Fri, 31 Oct 2025 19:14:54 +0000</pubDate>
				<category><![CDATA[Uncategorized]]></category>
		<guid isPermaLink="false">https://webaim.org/blog/?p=2806</guid>

					<description><![CDATA[Introduction In Microsoft Word and PowerPoint, there are many types of non-text content that can be given alternative text. We tested the alternative text of everything that we could think of in Word and PowerPoint and then converted these files to PDFs using Adobe&#8217;s Acrobat PDFMaker (the Acrobat Tab on Windows), Adobe&#8217;s Create PDF cloud [&#8230;]]]></description>
										<content:encoded><![CDATA[<section id="intro">
<h2>Introduction</h2>
<p>In Microsoft Word and PowerPoint, there are many types of non-text content that can be given alternative text. We tested the alternative text of everything that we could think of in Word and PowerPoint and then converted these files to PDFs using Adobe&#8217;s Acrobat PDFMaker (the Acrobat Tab on Windows), Adobe&#8217;s Create PDF cloud service (the Acrobat tab on Mac), and Microsoft&#8217;s built-in PDF exporting feature (save as PDF). With over 100 test cases tested first in Word and PowerPoint and then in three different PDFs (over 400 checks), here are the main takeaways.</p>
<ol>
<li><strong>Alt text within Word documents and PowerPoint presentations works very well.</strong> The process for adding alt text is consistent across every image type, and it is usually easy for screen readers to discover the alt text. Images in Word no longer require a layout of &#8220;In Line with Text&#8221; to avoid accessibility issues.</li>
<li><strong>Alt text in Microsoft&#8217;s PDF exporting feature is very good.</strong> If there is one criticism, it is that the specific image type can be added to the alternative text, making it repetitive (e.g., &#8220;Pie chart of sales by quarter (Chart: Pie)&#8221;).</li>
<li><strong>Alt text support in Adobe&#8217;s PDF tools is very disappointing.</strong> PDFs created with the Acrobat tab have problems with basically every type of image except Pictures.</li>
</ol>
<p>Details are below, including gotchas for almost every type of image.</p>
<section id="notes">
<h3>Notes</h3>
<ul>
<li>These tests were done in the desktop versions of Word and PowerPoint 365. Not all of these techniques apply to older or online versions of Office.</li>
<li>&#8220;Alt text&#8221; is the name for alternative text in Word and PowerPoint, so it is the term typically used in this document.</li>
<li>&#8220;Image&#8221; is used as a generic term for objects that can be given alt text.</li>
<li>Word and PowerPoint files were created using the current versions of Microsoft 365 for Windows (2509) and PDFMaker (25.1.20). The PDFs created with Create PDF cloud service were created on October 29, 2025.</li>
<li>The options to insert equations and symbols were not tested because they create text-based content.</li>
<li>Forms were not tested.</li>
</ul>
</section>
</section>
<section id="word">
<h2>Alt text in Word and PowerPoint</h2>
<p>Adding alt text is consistent across all image types. Selecting the object will display a temporary tab that includes the word &#8220;Format&#8221; (e.g., &#8220;Shape Format&#8221;). There is an <span class="menuchoice">Alt Text</span> option in this tab.</p>
<p><img decoding="async" src="/blog/media/alttext/alt-button.png" width="475" height="149" alt="Screenshot of the Shape Format tab with the Alt Text option highlighted"/></p>
<p>You can also <span class="menuchoice">right-click</span> on the image and choose <span class="menuchoice">View Alt Text</span>.</p>
<p>There will be a field to enter alt text and a checkbox for <span class="menuchoice">Mark as decorative</span>. There may also be options to add or accept AI-generated alt text (depending on your settings).</p>
<p><img decoding="async" src="/blog/media/alttext/alt-pane.png" width="325" height="509" alt="Screenshot of the Alt Text pane"/></p>
<div class="tip">
<div class="title">
			Tip
		</div>
<p>In Windows, you can keep the Alt Text pane open while using other tools like the Accessibility Assistant. To do this, click the <span class="menuchoice">Pane Options</span> icon &gt; <span class="menuchoice">Move Out of Tab</span>.</p>
<p><img loading="lazy" decoding="async" src="/blog/media/alttext/move-tab.png" width="379" height="293" alt="Screenshot with the pane options icon selected (in the upper-right of the pane), a menu expanded, and the Move out of Tab option highlighted."/></p>
</p></div>
<section id="assistant">
<h3>Accessibility Assistant</h3>
<p>Adding and correcting alt text is usually most efficient when you combine the Accessibility Assistant with a manual review.</p>
<p>The Accessibility Assistant will automatically identify images with missing or suspicious alt text. There are several ways to start running the Accessibility Assistant, including <span class="menuchoice">Check Accessibility</span> on the <span class="menuchoice">Review</span> tab. The Accessibility Assistant pane has grouped all of its alt text issues into one category&mdash;<span class="menuchoice">Missing alt text</span>. Choosing this category will step you through adding alt text to each image with missing or AI-generated alt text.</p>
<p>Word has an especially useful and recommended feature that adds inline prompts for accessibility fixes. To enable this, go to <span class="menuchoice">File</span> tab &gt; <span class="menuchoice">Options</span> &gt; <span class="menuchoice">Accessibility</span> (Windows) or <span class="menuchoice">Word</span> &gt; <span class="menuchoice">Preferences</span> &gt; <span class="menuchoice">Accessibility</span> (Mac) and then check <span class="menuchoice">Show accessibility status inline with the document</span>. A small icon will appear to prompt you to make inline accessibility fixes. Clicking this icon (this is mouse only) will open a dialog where you can add or change alt text, approve AI-generated alt text, or mark as decorative.</p>
<p><img loading="lazy" decoding="async" class="border" src="/blog/media/alttext/inline.png" width="446" height="296" alt="A photo of the WebAIM logo with the inline accessibility icon to its left. Clicking  the icon opens a window where alternative text has been entered."/></p>
<div class="important">
<div class="title">
				Important
			</div>
<p>Remember to save changes to the alt text by choosing the <span class="menuchoice">Save</span> (Windows) or <span class="menuchoice">Approve</span> (Mac) after entering alt text. Unlike the Alt Text pane, changes are not saved automatically.</p>
</p></div>
</section>
</section>
<section id="microsoft">
<h2>Microsoft&#8217;s Built-in PDF Conversion</h2>
<p>For many years, the Acrobat tab consistently created PDFs with a clean structure that was easier to review in Acrobat. In late 2024, <a href="https://learn.microsoft.com/en-us/office/pdf/office2024pdfaccessibility" target="_blank">Microsoft announced significant improvement to the accessibility of their exported PDFs</a> that matched Adobe in some places and surpassed it in others. While there may still be some areas where PDFs created by Adobe&#8217;s PDFMaker and cloud services are superior, Microsoft is the clear winner when it comes to alt text. <a href="https://webaim.org/techniques/acrobat/converting#save">Creating PDFs using <span class="menuchoice">Export</span> or <span class="menuchoice">Save As</span></a> maintains alternative text for almost every image type, with emoji being the only true failure.</p>
<p>The main issue isn&#8217;t missing information in the alt text, but extraneous information. Except for pictures, the image type is typically added to the alt text that was defined in the document. This can sometimes be helpful, but it is often repetitive or even confusing. For example, there are about 150 types of shapes, each with a unique name, so a two-sided arrow with alt text of &#8220;Two-way communication&#8221; would have alternative text of &#8220;Two-way communication (Arrow: Left-Right)&#8221; in the PDF.</p>
</section>
<section id="adobe">
<h2>Adobe&#8217;s Acrobat Tab</h2>
<p><a href="https://webaim.org/techniques/acrobat/converting#pdfmaker">PDFs created with the <span class="menuchoice">Acrobat</span> tab</a> will vary based on your operating system. On Windows, it uses Acrobat PDFMaker, which is installed when you install Acrobat. On Mac, it uses Adobe&#8217;s &#8220;Create PDF&#8221; cloud service. The PDFs created by these two tools are different, but they have one thing in common-they both often lose or corrupt alt text as part of the conversion process.</p>
<section id="picture">
<h3>If in doubt, convert it to a Picture.</h3>
<p>A &#8220;Picture&#8221; is a specific type of image in Word and PowerPoint. Photos, as well as most images pasted from non-Office sources, are Pictures. You will know if something is a Picture if selecting it causes the <span class="menuchoice">Picture Format</span> tab to appear in the ribbon.</p>
<p>A Picture with its alternative text is consistently converted to PDFs created with both PDFMaker and the Adobe cloud service. One way to ensure that all your images are correctly tagged as a PDF is to convert them to Pictures first. To  do this, first copy or cut the image. On Windows, paste it back into the page  using <span class="menuchoice">right-click</span> &gt; <span class="menuchoice">Paste Options</span> &gt; <span class="menuchoice">Picture</span>.</p>
<p><img loading="lazy" decoding="async" class="border" src="/blog/media/alttext/paste-options.png" width="353" height="358" alt="screenshot"/></p>
<p>On Mac, <span class="menuchoice">right-click</span> (or select the <span class="menuchoice">Edit</span> menu) &gt; choose <span class="menuchoice">Paste Special</span> &gt; and then select one of the 4 &quot;Picture&quot; file types. </p>
<p>While pasting as a Picture a good option for many types of images, some things cannot be pasted as pictures. This includes audio and video objects that would lose their main purpose.</p>
<p>If an image supports being pasted as a Picture, the new picture can no longer be edited, so do this with caution. It is probably a good idea to create a duplicate version of a file and do this as a final step before creating a PDF.</p>
<div class="important">
<div class="title">
				Important
			</div>
<p>An image&#8217;s alt text will be lost when pasting it as a Picture! To avoid losing the alt text, copy&mdash;don&#8217;t cut&mdash;the image, paste as a picture, copy/paste the alt text, and then delete the original picture.</p>
</p></div>
</section>
</section>
<section id="gotchas">
<h2>Gotchas for Different Image Types</h2>
<p>The dozens of alt text bugs are too numerous to mention (especially creating a PDF using the Acrobat tab), but here are some notable quirks and pitfalls for different image types.</p>
<ul>
<li><strong>Shapes:</strong>
<ul>
<li>Word PDFMaker does not maintain alt text for shapes.</li>
<li>In PDFs created by Microsoft, shape types will always be appended to the alt text.</li>
</ul>
</li>
<li><strong>Icons</strong> maintain their alt text when converted to PDF. Just be sure to review and, if needed, change the preset alt text.</li>
<li><strong>Video and Audio:</strong> Even though embedded multimedia may not be included in PDF, the alt text for the image that presents it is converted.</li>
<li><strong>3D Models</strong> are poorly supported in Adobe PDFs. Converting to a picture is recommended when using the Acrobat tab.</li>
<li><strong>Charts</strong>
<ul>
<li>PDFMaker has no alt text support for charts in Word or PowerPoint.</li>
<li>The text information contained in a chart is not typically added to the alt text, so be sure to include important text information in the alt text or in a nearby table or text description.</li>
</ul>
</li>
<li><strong>SmartArt</strong>
<ul>
<li>Do not bother adding alternative text to the different components within a SmartArt image. It is not easy to discover in Word and PowerPoint, and it is never included when converted to PDF.</li>
<li>If SmartArt does not have alt text, the text within the SmartArt will be defined as the alt text in the resulting PDF.</li>
</ul>
</li>
<li><strong>Groups:</strong>
<ul>
<li>Microsoft PDFs will include the group alt text, plus the alt text or text of the items within the group.</li>
<li>The inconsistencies of Adobe PDFs are too numerous to list. If you&#8217;re using the Acrobat tab, converting a group to a picture is recommended.</li>
</ul>
</li>
<li><strong>Tables:</strong> Do not add alt text to tables. In PDFs created from PowerPoint, it can cause the table&#8217;s contents to be ignored completely.</li>
<li><strong>Draw tab</strong>
<ul>
<li>Your drawing will be saved as a single image until you change a page or slide, change a drawing tool, or stop drawing.</li>
<li>In PowerPoint, PDFMaker does not convert these drawings at all, meaning they do not even appear in the PDF.</li>
<li>To make it easier to add alternative text to drawings it may be easier to group them or convert them to a Picture using Paste Options.</li>
</ul>
</li>
<li><strong>Emoji</strong>: Only the Adobe cloud service provides alt text for emoji, though it does this by converting them into black and white emoji.</li>
<li><strong>Placeholders, text boxes and WordArt in PowerPoint</strong>
<ul>
<li>Be very careful adding outlines or fills to any of these container types. This can impact how they are read (or in the case of PDFMaker, not read).</li>
<li>Any content that is marked as decorative should be excluded from the tag structure when converting to PDF. This can be a useful technique when used intentionally. Unfortunately, the Adobe cloud service ignores &#8220;Mark as decorative&#8221; unless the container has an outline or fill.</li>
</ul>
</li>
<li><strong>Text Boxes and WordArt in Word:</strong> PDFMaker will not convert alt text or the contents of Text Boxes or WordArt in Word. Adding outlines and fills to Word paragraphs does not cause any problems, so use this technique in Word instead.</li>
<li><strong>Text effects in Word:</strong> Applying text effects like shadows and reflections will cause the text to be ignored in PDFs created with the Acrobat tab. It can also cause issues in Microsoft PDFs (like a screen reader reading &#8220;dot&#8221; for each period). The best way to address this issue to is to cut the problematic text, paste it as a Picture and then immediately paste the same text into the Alt Text field (Windows-only).</li>
</ul>
</section>
<section id="nutshell">
<h2>In a Nutshell</h2>
<p>When it comes to alt text in Word and PowerPoint files. Keep  the following principles in mind:</p>
<ol>
<li>Use the <strong>Accessibility Assistant</strong> and <strong>Alt  Text pane</strong> to add alternative text to your images. </li>
<li>Choose <strong>Microsoft&#8217;s built-in PDF conversion</strong> for the best alt text results, especially if you have complex images. </li>
<li>If you are using the Adobe&#8217;s <strong>Acrobat tab</strong> to create PDFs, either convert your complex images to Pictures or be ready to do significant <a href="https://webaim.org/techniques/acrobat/reviewing">repair in Acrobat</a>.</li>
</ol>
</section>
]]></content:encoded>
					
					<wfw:commentRss>https://webaim.org/blog/word-and-powerpoint-alt-text-roundup/feed/</wfw:commentRss>
