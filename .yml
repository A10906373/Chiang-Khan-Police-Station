		<item>
		<title>Accessibility by Design: Preparing K–12 Schools for What’s Next</title>
		<link>https://webaim.org/blog/accessibility-by-design/</link>
					<comments>https://webaim.org/blog/accessibility-by-design/#comments</comments>
		
		<dc:creator><![CDATA[Cynthia Curry]]></dc:creator>
		<pubDate>Wed, 30 Jul 2025 17:51:46 +0000</pubDate>
				<category><![CDATA[Uncategorized]]></category>
		<guid isPermaLink="false">https://webaim.org/blog/?p=2802</guid>

					<description><![CDATA[Delivering web and digital accessibility in any environment requires strategic planning and cross-organizational commitment. While the goal (ensuring that websites and digital platforms do not present barriers to individuals with disabilities) and the standards (the Web Content Accessibility Guidelines) remain constant, implementation must be tailored to each organization’s needs and context.&#160;&#160; For K–12 educational agencies, [&#8230;]]]></description>
										<content:encoded><![CDATA[
<p class="wp-block-paragraph">Delivering web and digital accessibility in any environment requires strategic planning and cross-organizational commitment. While the goal (ensuring that websites and digital platforms do not present barriers to individuals with disabilities) and the standards (the Web Content Accessibility Guidelines) remain constant, implementation must be tailored to each organization’s needs and context.&nbsp;&nbsp;</p>



<p class="wp-block-paragraph">For K–12 educational agencies, including state educational agencies (SEAs) and school districts, digital accessibility efforts must align with existing priorities, practices, and policies. A one-size-fits-all approach simply won’t work.&nbsp;</p>



<h2 class="wp-block-heading">A Foundation in Special Education and Alternatives to Print Materials&nbsp;</h2>



<p class="wp-block-paragraph">Since 1975, the <a href="https://sites.ed.gov/idea/" target="_blank" rel="noreferrer noopener">Individuals with Disabilities Education Act (IDEA)</a> has required that students with disabilities be provided access to the general education curriculum. When IDEA was last reauthorized in 2004, it included a provision that SEAs and districts provide accessible formats of print materials—such as braille, large print, digital text, and audio—to eligible students with disabilities.&nbsp;</p>



<p class="wp-block-paragraph">Each SEA is required to define what constitutes a “timely manner” for providing accessible formats. Most states have adopted a definition that aligns with the expectation that students with disabilities receive accessible formats <em>at the same time</em> as their peers without disabilities receive the print version of the materials.&nbsp;</p>



<p class="wp-block-paragraph">To help meet this requirement, Congress established the National Instructional Materials Accessibility Standard (NIMAS) and the National Instructional Materials Access Center (NIMAC). Together, <a href="https://ncademi.org/resources/publications/nimas-nimac-seas-leas/" target="_blank" rel="noreferrer noopener">NIMAS and the NIMAC</a> have supported the timely delivery of accessible formats in K–12 settings for nearly two decades.&nbsp;</p>



<h2 class="wp-block-heading">The Shift to Digital and New Challenges for Accessibility&nbsp;</h2>



<p class="wp-block-paragraph">While IDEA remains grounded in the early 2000s, the instructional landscape in K-12 schools has rapidly shifted from print to digital. Relative to most higher education institutions, SEAs and school districts haven’t kept pace with digital accessibility. One reason for this lies in the differences between the primary disability laws that govern K–12 versus higher education. In K–12, IDEA guarantees a free appropriate public education (FAPE), which includes an individualized education program (IEP) and specially designed instruction. This model often includes <strong>individualized assistance</strong> to address the daily accessibility issues experienced by students with disabilities. For example, a paraprofessional might assist a student whose assistive technology doesn’t work with an inaccessible website assigned for homework. These interventions, although understandable in context, have interfered with progress toward removing digital barriers in K-12.&nbsp;&nbsp;&nbsp;</p>



<p class="wp-block-paragraph">By contrast, in higher education, the <a href="https://www.ada.gov/" target="_blank" rel="noreferrer noopener">Americans with Disabilities Act (ADA)</a> emphasizes equal access through <strong>reasonable accommodations</strong>. While accommodations should be individually designed to meet the access needs of the student with a disability, the ADA states that accommodations are not required when they would result in a fundamental alteration of the student’s educational program. Because postsecondary students with disabilities are expected to make educational progress with considerable independence, higher ed institutions have had to be proactive with digital accessibility to ensure equitable and effective access to course materials and platforms.&nbsp;&nbsp;</p>



<h2 class="wp-block-heading">ADA Title II Raises the Bar for Digital Accessibility in K–12&nbsp;</h2>



<p class="wp-block-paragraph">The <a href="https://webaim.org/blog/impact-of-rulemaking/" target="_blank" rel="noreferrer noopener">recent ADA Title II final rule</a> makes it clear that the responsibilities of SEAs and school districts extend beyond providing accessible formats. Under the ADA, the digital educational materials provided by schools must meet specific accessibility standards by either April 24, 2026 (SEAs and larger school districts) or April 26, 2027 (smaller school districts). This is a significant challenge for schools that have been operating for decades under the model of individualized accommodations required by IDEA.&nbsp;</p>



<h2 class="wp-block-heading">Partnering for Progress: NCADEMI&nbsp;</h2>



<p class="wp-block-paragraph">WebAIM is proud to partner with the <a href="https://ncademi.org/" target="_blank" rel="noreferrer noopener">National Center on Accessible Digital Educational Materials &amp; Instruction (NCADEMI)</a>, pronounced “n-cademy,” to help SEAs and school districts meet ADA Title II requirements. Launched on October 1, 2024, and funded by the Office of Special Education Programs at the U.S. Department of Education, NCADEMI supports the timely provision and effective use of accessible digital materials for learners with disabilities, from early intervention through high school graduation.&nbsp;</p>



<h3 class="wp-block-heading">Free Tools and Training from NCADEMI&nbsp;</h3>



<p class="wp-block-paragraph">NCADEMI provides a range of no-cost resources and training to help education agencies meet digital accessibility obligations, including:&nbsp;</p>



<ul class="wp-block-list">
<li><a href="https://ncademi.org/resources/publications/roadmap/" target="_blank" rel="noreferrer noopener">Meeting the ADA Title II Web and Mobile Accessibility Requirements: A Roadmap for State and Local Educational Agencies</a> </li>
</ul>



<ul class="wp-block-list">
<li><a href="https://ncademi.org/resources/basics/" target="_blank" rel="noreferrer noopener">Core Skills for Digital Accessibility</a> </li>
</ul>



<ul class="wp-block-list">
<li><a href="https://ncademi.org/resources/diy-accessibility-basics/" target="_blank" rel="noreferrer noopener">Do-It-Yourself Accessibility Basics</a> </li>
</ul>



<ul class="wp-block-list">
<li><a href="https://ncademi.org/resources/publications/procurement/" target="_blank" rel="noreferrer noopener">Including Accessibility in All Components of Procurement: A Guide for SEAs and School Districts</a> </li>
</ul>



<ul class="wp-block-list">
<li><a href="https://ncademi.org/events/webinars/" target="_blank" rel="noreferrer noopener">Browse our archive of recorded webinars</a> </li>
</ul>



<h3 class="wp-block-heading">What’s Next: Quality Indicators and Implementation Tools&nbsp;</h3>



<p class="wp-block-paragraph">As NCADEMI approaches its second year, we’re preparing to launch the <em>Quality Indicators for the Provision and Use of Accessible Materials in PreK–12 Systems</em>. These will include research-based readiness protocols and self-assessment tools designed specifically for SEAs and school districts. Virtual coaching on best practices for implementing the Quality Indicators will be available to SEA and district teams starting in October 2025.&nbsp;&nbsp;</p>



<p class="wp-block-paragraph">To stay informed about new tools and opportunities, <a href="https://ncademi.org/newsletter/" target="_blank" rel="noreferrer noopener">subscribe to NCADEMI’s newsletter</a> and <a href="https://www.linkedin.com/company/ncademi/" target="_blank" rel="noreferrer noopener">follow NCADEMI on LinkedIn</a>. Contact us directly at <a href="mailto:ncademi@usu.edu" target="_blank" rel="noreferrer noopener">ncademi@usu.edu</a>.&nbsp;&nbsp;</p>
]]></content:encoded>
					
