เงื่อนไขการให้บริการ

รับประกันจากผู้ผลิต 1 ปี

• การรับประกันแบบจำกัดของ Baofeng ครอบคลุมสินค้าใหม่ทุกชิ้นที่จำหน่ายโดย baofengradio.com และตัวแทนจำหน่ายที่ได้รับอนุญาตอื่นๆ

• การรับประกันนี้ไม่สามารถโอนได้ และต้องมีหลักฐานการซื้อจากเราหรือตัวแทนจำหน่ายที่ได้รับอนุญาตเพื่อขอรับบริการตามการรับประกันการรับประกันแบบจำกัดนี้ครอบคลุมอะไรบ้าง? เราขอรับประกันว่าผลิตภัณฑ์ปราศจากข้อบกพร่องในด้านวัสดุและฝีมือการผลิตภายใต้การใช้งานปกติและการใช้งานตามคู่มือการใช้งานผลิตภัณฑ์ที่เกี่ยวข้อง ในช่วงระยะเวลาการรับประกัน (ตามที่กำหนดไว้ด้านล่าง) โปรดดูคำแนะนำภายในบรรจุภัณฑ์แต่ละชิ้นสำหรับคำอธิบายเกี่ยวกับการใช้งานและการดูแลรักษาเครื่องอย่างถูกต้องการรับประกันแบบจำกัดนี้ไม่ครอบคลุมอะไรบ้าง? การรับประกันแบบจำกัดนี้ไม่ครอบคลุมความเสียหายที่เกิดขึ้นโดยตรงหรือโดยอ้อมอันเนื่องมาจากหรือเกิดขึ้นระหว่าง: (1) อุบัติเหตุ การใช้งานผิดวิธี การใช้ในทางที่ผิด การทำลายทรัพย์สิน หรือเหตุสุดวิสัย (รวมถึงฟ้าผ่าและสภาพอากาศอื่นๆ) (2) การใช้งานร่วมกับผลิตภัณฑ์อื่น หรือความเสียหายหรือการสูญเสียอื่นๆ ที่เกิดขึ้นจากการใช้งานหรือการใช้งานร่วมกับสิ่งของอื่นๆ(3) การบำรุงรักษาที่ไม่เหมาะสมหรือไม่เพียงพอ(4) การซ่อมแซมโดยช่างบริการที่ไม่ได้รับอนุญาต(5) การสึกหรอตามปกติหากคุณพึงพอใจกับผลิตภัณฑ์และบริการของเรา โปรดกรุณาให้คะแนนรีวิวสินค้าในเชิงบวกแก่เรา หากมีปัญหาใดๆ โปรดติดต่อเราได้  ที่ support@baofengradio.com เราพยายามตอบอีเมลทุกฉบับโดยเร็วที่สุด แต่เนื่องจากปริมาณอีเมลจำนวนมาก อาจต้องใช้เวลาในการตอบกลับ ขอขอบคุณล่วงหน้าสำหรับความอดทนของคุณ!
